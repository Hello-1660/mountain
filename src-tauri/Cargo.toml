[package]
name = "Mountain"
version = "1.2.0"
description = "桌面坞"
authors = ["tingshang"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
ureq = "3.3.0"
semver = "1.0.28"
windows = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
# Workaround: schemars 0.8.22 (used by tauri-build) pulls indexmap 1.x without the `std`
# feature, so indexmap is compiled no_std and its `IndexMap<K,V,S>` loses the default `S`,
# breaking schemars' `Map<K,V> = indexmap::IndexMap<K,V>` (E0107). Forcing `std` here makes
# Cargo unify indexmap 1.9.x with the `std` feature enabled.
indexmap = { version = "=1.9.3", features = ["std"] }

